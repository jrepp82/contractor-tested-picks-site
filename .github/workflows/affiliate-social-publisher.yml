name: Affiliate Social QA — PUBLISH HARD DISABLED

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'affiliate-social-publisher.js'
      - 'affiliate-content-feed-builder.js'
      - 'affiliate-content-feed.json'
      - 'normalized-products.json'
      - 'youtube-shorts-publisher.js'
      - 'threads-publisher.js'
      - 'meta-expansion-publisher.js'
      - 'social-quality-gate.js'
      - '.github/workflows/affiliate-social-publisher.yml'

permissions:
  contents: read

concurrency:
  group: affiliate-social-qa-disabled-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRESTIGE_SOCIAL_PUBLISH_DISABLED: 'true'
    steps:
      - name: Enforce global social publish kill switch
        shell: bash
        run: |
          test "$PRESTIGE_SOCIAL_PUBLISH_DISABLED" = 'true'
          echo 'Affiliate/social publishing is HARD-DISABLED. No scheduled or live platform delivery is permitted.'

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check social code without executing publishers
        shell: bash
        run: |
          node --check affiliate-social-publisher.js
          node --check threads-publisher.js
          node --check meta-expansion-publisher.js
          node --check social-quality-gate.js
          node --check youtube-shorts-publisher.js

      - name: Validate affiliate feed only
        shell: bash
        run: |
          node affiliate-content-feed-builder.js --validate

      - name: Verify workflow contains no channel credentials or publisher execution
        shell: bash
        run: |
          test "$PRESTIGE_SOCIAL_PUBLISH_DISABLED" = 'true'
          echo 'SAFE HOLD VERIFIED: validation only; no Meta, Threads, TikTok, YouTube or other social publishing action runs.'
