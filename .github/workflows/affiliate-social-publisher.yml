name: Affiliate Social Publisher

on:
  pull_request:
    paths:
      - 'affiliate-social-publisher.js'
      - 'affiliate-content-feed-builder.js'
      - 'affiliate-content-feed.json'
      - 'normalized-products.json'
      - 'youtube-shorts-publisher.js'
      - 'threads-publisher.js'
      - 'meta-expansion-publisher.js'
      - 'social-quality-gate.js'
      - '.github/workflows/affiliate-social-publisher.yml'
  push:
    paths:
      - '.social-launch-now'
  schedule:
    - cron: '0 18 * * *'
    - cron: '0 20 * * *'
    - cron: '0 22 * * *'
    - cron: '0 0 * * 1'
    - cron: '0 1 * * 2'
    - cron: '0 1 * * 3'
    - cron: '0 0 * * 4'
    - cron: '0 0 * * 5'
    - cron: '0 21 * * 5'
    - cron: '0 0 * * 0'
    - cron: '0 18 * * 1'
    - cron: '0 11 * * 2'
    - cron: '0 3 * * 4'
    - cron: '0 18 * * 4'
    - cron: '0 23 * * 5'
    - cron: '0 22 * * 6'
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      platform:
        description: Channel to publish
        required: true
        type: choice
        default: all
        options: [all, facebook, instagram, threads, tiktok, youtube-shorts]
      dry_run:
        description: Build/validate without publishing
        required: true
        type: boolean
        default: true
      slot:
        description: Optional deterministic content slot
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: affiliate-social-publisher-${{ github.ref }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v24.0' }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'PUBLIC_TO_EVERYONE' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_EXPECTED_CHANNEL_ID: ${{ secrets.YOUTUBE_EXPECTED_CHANNEL_ID }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
      DIGITAL_FULFILLMENT_VERIFIED: 'false'
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check publishers
        run: |
          node --check affiliate-social-publisher.js
          node --check threads-publisher.js
          node --check meta-expansion-publisher.js
          node --check social-quality-gate.js

      - name: Install short-video render tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librsvg2-bin

      - name: Validate canonical 60-item feed
        run: node affiliate-content-feed-builder.js --validate

      - name: Resolve channel and slot
        shell: bash
        run: |
          PLATFORM="all"
          SLOT="${GITHUB_RUN_NUMBER}"
          DRY_RUN="false"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            DRY_RUN="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            PLATFORM='${{ inputs.platform }}'
            DRY_RUN='${{ inputs.dry_run }}'
            if [[ -n '${{ inputs.slot }}' ]]; then SLOT='${{ inputs.slot }}'; fi
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            PLATFORM="all"
            SLOT="launch-now-${GITHUB_RUN_NUMBER}"
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            case '${{ github.event.schedule }}' in
              '0 18 * * *') PLATFORM="facebook" ;;
              '0 20 * * *') PLATFORM="instagram" ;;
              '0 22 * * *') PLATFORM="threads" ;;
              '0 0 * * 1'|'0 1 * * 2'|'0 1 * * 3'|'0 0 * * 4'|'0 0 * * 5'|'0 21 * * 5'|'0 0 * * 0') PLATFORM="youtube-shorts" ;;
              '0 18 * * 1'|'0 11 * * 2'|'0 3 * * 4'|'0 18 * * 4'|'0 23 * * 5'|'0 22 * * 6'|'0 14 * * 0') PLATFORM="tiktok" ;;
            esac
          fi
          echo "TARGET_PLATFORM=${PLATFORM}" >> "$GITHUB_ENV"
          echo "PUBLISH_SLOT=${SLOT}" >> "$GITHUB_ENV"
          echo "PUBLISH_DRY_RUN=${DRY_RUN}" >> "$GITHUB_ENV"

      - name: Check channel authorization
        shell: bash
        run: |
          set -euo pipefail
          READY=false
          THREADS_READY=false
          has_meta_page=false
          [[ -n "${META_PAGE_ID:-}" && ( -n "${META_PAGE_ACCESS_TOKEN:-}" || -n "${META_ACCESS_TOKEN:-}" ) ]] && has_meta_page=true
          has_instagram=false
          [[ -n "${META_IG_USER_ID:-}" && -n "${META_ACCESS_TOKEN:-}" ]] && has_instagram=true
          has_tiktok=false
          [[ -n "${TIKTOK_ACCESS_TOKEN:-}" ]] && has_tiktok=true
          has_youtube=false
          [[ -n "${GOOGLE_CLIENT_ID:-}" && -n "${GOOGLE_CLIENT_SECRET:-}" && -n "${YOUTUBE_REFRESH_TOKEN:-}" ]] && has_youtube=true
          [[ -n "${THREADS_ACCESS_TOKEN:-}" ]] && THREADS_READY=true
          if [[ "${PUBLISH_DRY_RUN}" == "true" ]]; then
            READY=true
            THREADS_READY=true
          else
            case "${TARGET_PLATFORM}" in
              facebook) READY="${has_meta_page}" ;;
              instagram) READY="${has_instagram}" ;;
              tiktok) READY="${has_tiktok}" ;;
              youtube-shorts) READY="${has_youtube}" ;;
              threads) READY="${THREADS_READY}" ;;
              all)
                if [[ "${has_meta_page}" == "true" || "${has_instagram}" == "true" || "${has_tiktok}" == "true" || "${has_youtube}" == "true" || "${THREADS_READY}" == "true" ]]; then READY=true; fi
                ;;
            esac
          fi
          echo "AFFILIATE_CHANNEL_READY=${READY}" >> "$GITHUB_ENV"
          echo "AFFILIATE_THREADS_READY=${THREADS_READY}" >> "$GITHUB_ENV"
          if [[ "${READY}" != "true" ]]; then
            echo "::warning::No authorized ${TARGET_PLATFORM} publishing channel is configured; skipping cleanly without claiming publication."
          fi

      - name: Prepublish quality gate
        if: ${{ env.TARGET_PLATFORM != 'threads' && (env.PUBLISH_DRY_RUN == 'true' || env.AFFILIATE_CHANNEL_READY == 'true') }}
        run: node social-quality-gate.js --platform="${TARGET_PLATFORM}"

      - name: Publish core channels
        if: ${{ env.TARGET_PLATFORM != 'threads' && (env.PUBLISH_DRY_RUN == 'true' || env.AFFILIATE_CHANNEL_READY == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=("--platform=${TARGET_PLATFORM}" "--slot=${PUBLISH_SLOT}")
          if [[ "${PUBLISH_DRY_RUN}" == "true" ]]; then ARGS+=("--dry-run"); fi
          node affiliate-social-publisher.js "${ARGS[@]}" | tee social-publish-result.json
          if [[ "${PUBLISH_DRY_RUN}" != "true" ]]; then
            node -e "const r=require('./social-publish-result.json'); const bad=(r.results||[]).filter(x=>x.status==='ERROR'||x.ok===false); if(bad.length){console.error('Publishing did not complete:',JSON.stringify(bad,null,2)); process.exit(1)}"
          fi

      - name: Publish Threads
        if: ${{ (env.TARGET_PLATFORM == 'threads' || env.TARGET_PLATFORM == 'all') && (env.PUBLISH_DRY_RUN == 'true' || env.AFFILIATE_THREADS_READY == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=("--slot=${PUBLISH_SLOT}")
          if [[ "${PUBLISH_DRY_RUN}" == "true" ]]; then ARGS+=("--dry-run"); fi
          node threads-publisher.js "${ARGS[@]}" | tee threads-publish-result.json
          if [[ "${PUBLISH_DRY_RUN}" != "true" ]]; then
            node -e "const r=require('./threads-publish-result.json'); const bad=(r.results||[r]).filter(x=>x.status==='ERROR'||x.ok===false); if(bad.length){console.error('Threads publishing did not complete:',JSON.stringify(bad,null,2)); process.exit(1)}"
          fi

      - name: Preserve run result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-publish-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            social-publish-result.json
            threads-publish-result.json
            .social-output/
            .social-quality/
          if-no-files-found: ignore
          retention-days: 14
