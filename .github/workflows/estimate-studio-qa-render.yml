name: Estimate Studio QA Renderer

on:
  workflow_dispatch:
  push:
    paths:
      - '.estimate-studio-qa-launch'

permissions:
  contents: write

concurrency:
  group: estimate-studio-qa-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify approved Shopify artifact payload
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cdn.shopify.com/s/files/1/0739/9066/8477/files/prestige-digitools-contractor-estimate-proposal-studio-pro-v1.zip?v=1788474910'
          curl -fsSL "$URL" -o /tmp/estimate-studio-v1.zip
          echo "Hosted ZIP bytes: $(stat -c%s /tmp/estimate-studio-v1.zip)"
          echo "Hosted ZIP SHA256: $(sha256sum /tmp/estimate-studio-v1.zip | awk '{print $1}')"
          unzip -t /tmp/estimate-studio-v1.zip
          rm -rf /tmp/estimate-studio-payload && mkdir -p /tmp/estimate-studio-payload
          unzip -q /tmp/estimate-studio-v1.zip -d /tmp/estimate-studio-payload
          echo 'c3f8f68cc2ad938bae0310de725234341873e433cfeada0649eef5926eb836b6  /tmp/estimate-studio-payload/index.html' | sha256sum -c -
          echo 'e44d2cbf5596850a37acf5efc609afec5dc4d2a7ef6535b301662737f2c11ab0  /tmp/estimate-studio-payload/README.txt' | sha256sum -c -
          echo '2f63e0d7c90d80eb2411383a2f2b79eded3af60b89af1f54dbc3cadd01fbce30  /tmp/estimate-studio-payload/LICENSE.txt' | sha256sum -c -
      - name: Materialize noindex QA app from verified payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p digitools/estimate-proposal-studio-v1/app
          cp /tmp/estimate-studio-payload/index.html digitools/estimate-proposal-studio-v1/app/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('digitools/estimate-proposal-studio-v1/app/index.html')
          s=p.read_text()
          marker='<meta name="viewport" content="width=device-width,initial-scale=1">'
          if 'name="robots"' not in s:
              s=s.replace(marker, marker+'\n<meta name="robots" content="noindex,nofollow,noarchive">',1)
          p.write_text(s)
          PY
          grep -q 'Contractor Estimate & Proposal Studio PRO' digitools/estimate-proposal-studio-v1/app/index.html
          grep -q 'noindex,nofollow,noarchive' digitools/estimate-proposal-studio-v1/app/index.html
      - name: Persist verified QA app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Prestige QA Automation'
          git config user.email 'automation@users.noreply.github.com'
          git add digitools/estimate-proposal-studio-v1/app/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Estimate Studio V1 QA app'
            git pull --rebase
            git push
          fi
