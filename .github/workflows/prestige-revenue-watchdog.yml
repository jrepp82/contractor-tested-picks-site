name: Prestige Revenue Funnel Watchdog Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
  push:
    paths:
      - '.revenue-watchdog-launch'

permissions:
  contents: read

concurrency:
  group: prestige-revenue-watchdog
  cancel-in-progress: true

jobs:
  revenue-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check public revenue routes
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local label="$1" url="$2"
            echo "Checking $label — $url"
            curl --retry 2 --retry-delay 3 --connect-timeout 12 --max-time 30 -fsSL "$url" -o /tmp/route.out
            printf 'PASS: %s\n' "$label" >> "$GITHUB_STEP_SUMMARY"
          }
          check "Prestige Remodeling homepage" "https://PrestigeRemodelingWI.com/"
          grep -qi "Send Estimate Request" /tmp/route.out
          check "Prestige DigiTools storefront" "https://contractor-tested-picks-site.vercel.app/digitools/"
          grep -qi "Prestige Contractor Lifetime Vault" /tmp/route.out
          check "Estimate Audit / Plan-Check intake" "https://contractor-tested-picks-site.vercel.app/digitools/audit-intake.html"
          check "Instant Project Qualifier" "https://contractor-tested-picks-site.vercel.app/instant-estimate.html"
          check "Affiliate Recommender" "https://contractor-tested-picks-site.vercel.app/affiliate-recommender.html"
          check "Priority Site Visit" "https://contractor-tested-picks-site.vercel.app/priority-site-visit.html"
          check "Revenue Expansion hub" "https://contractor-tested-picks-site.vercel.app/revenue-lab/"
          grep -qi "Five cash engines" /tmp/route.out
          check "Prestige Revenue Router" "https://prestige-revenue-router-6ryzai.v2.appdeploy.ai/"
          grep -qi "Prestige Revenue Router" /tmp/route.out
          check "Lead Exchange bridge" "https://contractor-tested-picks-site.vercel.app/revenue-lab/lead-broker.html"
          grep -qi "prestige-revenue-router-6ryzai.v2.appdeploy.ai/#lead" /tmp/route.out
          check "Emergency Dispatch bridge" "https://contractor-tested-picks-site.vercel.app/revenue-lab/emergency-dispatch.html"
          grep -qi "prestige-revenue-router-6ryzai.v2.appdeploy.ai/#dispatch" /tmp/route.out
          check "Seller Photo Cleanup offer" "https://contractor-tested-picks-site.vercel.app/revenue-lab/photo-cleanup-lifetime.html"
          grep -qi "Get Lifetime Access" /tmp/route.out
          check "Seller Photo Cleanup Utility" "https://contractor-tested-picks-site.vercel.app/revenue-lab/card-photo-cleaner.html"
          grep -qi "Process Batch" /tmp/route.out
          check "Collectibles Arbitrage Control" "https://contractor-tested-picks-site.vercel.app/revenue-lab/arbitrage-control.html"
          grep -qi "Expected graded profit" /tmp/route.out
          check "Industrial Surplus Spread Analyzer" "https://contractor-tested-picks-site.vercel.app/revenue-lab/surplus-spread-calculator.html"
          grep -qi "40% of conservative liquidation" /tmp/route.out

      - name: Verify material checklist PDF
        shell: bash
        run: |
          set -euo pipefail
          headers=$(mktemp)
          curl --retry 2 --connect-timeout 12 --max-time 30 -fsSL -D "$headers" "https://contractor-tested-picks-site.vercel.app/api/material-checklist" -o /tmp/material-checklist.pdf
          grep -qi "content-type: application/pdf" "$headers"
          head -c 5 /tmp/material-checklist.pdf | grep -q "%PDF-"
          echo "PASS: Homeowner Material Checklist PDF" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live Stripe checkout URLs
        shell: bash
        run: |
          set -euo pipefail
          links=(
            "https://buy.stripe.com/5kQ28r9pS4HW1w5blD7ss00"
            "https://buy.stripe.com/eVq4gzcC44HW0s1exP7ss09"
            "https://buy.stripe.com/5kQeVd0Tm6Q4gqZcpH7ss0a"
            "https://buy.stripe.com/7sYbJ19pS1vKgqZ9dv7ss0b"
            "https://buy.stripe.com/8x27sL31u1vKdeN61j7ss0c"
            "https://buy.stripe.com/28E4gz59C5M03Ed89r7ss0d"
            "https://buy.stripe.com/28EdR90TmcaodeN2P77ss0g"
            "https://buy.stripe.com/fZuaEX6dG3DS1w575n7ss0e"
            "https://buy.stripe.com/28EeVdgSkdes8YxgFX7ss0l"
            "https://buy.stripe.com/eVq3cv6dG5M0caJ2P77ss0m"
            "https://buy.stripe.com/9B6bJ1atWeiw8Yx9dv7ss0p"
          )
          for url in "${links[@]}"; do
            curl --retry 2 --connect-timeout 12 --max-time 30 -fsSL "$url" -o /dev/null
          done
          echo "PASS: 11 live Stripe checkout routes responded" >> "$GITHUB_STEP_SUMMARY"
