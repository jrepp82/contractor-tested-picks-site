name: Prestige Social Publisher

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate generation and channel readiness without publishing
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '0 14 * * *'
  push:
    paths:
      - '.prestige-social-launch-now'

permissions:
  contents: write

concurrency:
  group: prestige-social-publisher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v24.0' }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'PUBLIC_TO_EVERYONE' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_EXPECTED_CHANNEL_ID: ${{ secrets.YOUTUBE_EXPECTED_CHANNEL_ID }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install premium reel tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts
          ffmpeg -version | head -1
          edge-tts --version

      - name: Resolve execution mode
        shell: bash
        run: |
          DRY_RUN=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            DRY_RUN='${{ inputs.dry_run }}'
          fi
          echo "PRESTIGE_DRY_RUN=${DRY_RUN}" >> "$GITHUB_ENV"
          echo "Prestige dry run: ${DRY_RUN}"

      - name: Validate publisher code
        run: |
          python -m py_compile prestige-social/generator.py prestige-social/publisher.py
          node --check youtube-shorts-publisher.js

      - name: Probe Money Machine Social Bot handoff
        shell: bash
        run: |
          set +e
          curl -sS -L --max-time 90 -D /tmp/bot-headers.txt -o /tmp/bot-body.txt -w 'HTTP_STATUS=%{http_code}\nCONTENT_TYPE=%{content_type}\nRESPONSE_BYTES=%{size_download}\n' 'https://api-v2.appdeploy.ai/app/money-machine-bot-hub-uvnwsq/api/social-package'
          CURL_RC=$?
          echo "CURL_RC=${CURL_RC}"
          echo '--- response headers ---'
          cat /tmp/bot-headers.txt || true
          echo '--- response preview ---'
          head -c 1800 /tmp/bot-body.txt || true
          echo
          exit 0

      - name: Generate premium Prestige reel with retry
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Premium media generation attempt ${attempt}/3"
            python prestige-social/generator.py && exit 0
            RC=$?
            echo "Generation attempt ${attempt} failed with ${RC}"
            sleep $((attempt * 10))
          done
          echo 'Premium Prestige media generation failed after 3 attempts.'
          exit 1

      - name: Enforce premium media gate
        run: |
          python - <<'PY'
          import datetime, json, pathlib
          today = datetime.date.today().isoformat()
          root = pathlib.Path('.social-output/prestige-local') / today
          package = json.loads((root / 'package.json').read_text())
          video = pathlib.Path(package['video_path'])
          cq = package.get('quality') or {}
          vq = (package.get('media') or {}).get('quality') or {}
          assert cq.get('passed') and float(cq.get('score', 0)) >= 90, cq
          assert vq.get('passed') and float(vq.get('score', 0)) >= 90, vq
          assert package.get('media_mode') == 'premium-ai-visual-motion-reel', package.get('media_mode')
          assert video.exists() and video.stat().st_size >= 300000, video
          print('Premium gate PASS:', cq.get('score'), vq.get('score'), video)
          PY

      - name: Persist generated media before live publishing
        if: ${{ env.PRESTIGE_DRY_RUN != 'true' }}
        run: |
          git config user.name 'Prestige Automation'
          git config user.email 'automation@users.noreply.github.com'
          git add prestige-social/queue .social-output/prestige-local
          if ! git diff --cached --quiet; then
            git commit -m "Generate premium daily Prestige social media"
            git pull --rebase
            git push
            sleep 10
          fi

      - name: Publish Prestige content to connected channels
        run: python prestige-social/publisher.py

      - name: Commit delivery results
        if: always() && env.PRESTIGE_DRY_RUN != 'true'
        run: |
          git config user.name 'Prestige Automation'
          git config user.email 'automation@users.noreply.github.com'
          git add prestige-social/queue .social-output/prestige-local
          if ! git diff --cached --quiet; then
            git commit -m "Record Prestige social delivery results"
            git pull --rebase
            git push
          fi
