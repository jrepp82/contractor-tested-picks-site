name: Prestige Social Publisher
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish queued Prestige content through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python prestige-social/publisher.py
      - name: Commit delivery results
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Prestige Automation'
          git config user.email 'automation@users.noreply.github.com'
          git add prestige-social/queue
          git commit -m 'Record Prestige social delivery results'
          git push
