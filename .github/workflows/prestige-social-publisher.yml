name: Prestige Social Publisher — HALTED FOR QUALITY REBUILD

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Quality-rebuild validation only. Publishing is hard-disabled.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: prestige-social-publisher-halted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-rebuild-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish kill switch
        shell: bash
        run: |
          echo 'PRESTIGE_SOCIAL_PUBLISH_DISABLED=true' >> "$GITHUB_ENV"
          echo 'Prestige social publishing is HARD-DISABLED pending quality rebuild.'
          echo 'No Facebook, Instagram, TikTok, YouTube Shorts, Threads, or Nextdoor publish action will run from this workflow.'

      - name: Confirm safe hold
        shell: bash
        run: |
          test "${PRESTIGE_SOCIAL_PUBLISH_DISABLED}" = "true"
          echo 'SAFE HOLD VERIFIED: generation/publishing pipeline is disabled. Manual quality review is required before any future re-enable.'
